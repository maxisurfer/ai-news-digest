name: Daily News Digest

on:
  schedule:
    - cron: "0 10 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate digest only (no email/Discord)"
        type: boolean
        default: false

jobs:
  generate-and-send-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: America/Sao_Paulo
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and send news digest
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          NOTIFICATION_METHODS: ${{ secrets.NOTIFICATION_METHODS }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AI_RESPONSE_LANGUAGE: en
          DRY_RUN: ${{ env.DRY_RUN }}
        run: |
          python main.py

      - name: Commit sent history
        if: success() && env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_history.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update sent history"
          git push

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
          retention-days: 7
